<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Nwafor Arinze Jeremiah, Mechatronics Engineering student and aspiring cybersecurity analyst" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1824"/>
      <stop offset="1" stop-color="#14283B"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0C1824" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#0C1824" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0C1824" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>

  <!-- circuit traces -->
  <g fill="none" stroke="#2A4A66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
