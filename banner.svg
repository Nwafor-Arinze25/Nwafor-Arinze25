    <polyline points="1000,184 950,184 920,214 780,214 750,244 640,244"/>
    <polyline points="1120,160 1180,160 1210,130 1280,130"/>
    <polyline points="1120,184 1170,184 1200,214 1280,214"/>
    <polyline points="1060,92 1060,50 1090,20 1090,0"/>
    <polyline points="1060,240 1060,280 1030,300 1030,320"/>
    <polyline points="860,130 860,60 830,30 830,0"/>
    <polyline points="860,214 860,280 890,310 890,320"/>
  </g>
  <g fill="#0C1824" stroke="#2A4A66" stroke-width="2">
    <circle cx="600" cy="100" r="5"/>
    <circle cx="640" cy="244" r="5"/>
    <circle cx="830" cy="0" r="5"/>
    <circle cx="890" cy="320" r="5"/>
    <circle cx="1090" cy="0" r="5"/>
    <circle cx="1030" cy="320" r="5"/>
  </g>
  <g fill="#C9803F">
    <circle cx="910" cy="130" r="4"/>
    <circle cx="920" cy="214" r="4"/>
    <circle cx="1180" cy="160" r="4"/>
    <circle cx="1170" cy="184" r="4"/>
  </g>

  <!-- shield -->
  <g transform="translate(0,0)">
    <path d="M1060 92 L1124 114 V166 C1124 206 1094 232 1060 246 C1026 232 996 206 996 166 V114 Z"
          fill="#10202F" stroke="#C9803F" stroke-width="3" stroke-linejoin="round"/>
    <path d="M1060 108 L1108 124 V166 C1108 196 1086 216 1060 228 C1034 216 1012 196 1012 166 V124 Z"
          fill="none" stroke="#2A4A66" stroke-width="1.5"/>
    <g fill="none" stroke="#E6EDF3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="1060,172 1060,148 1080,148"/>
      <polyline points="1060,172 1038,172 1038,194"/>
      <polyline points="1060,172 1082,172 1082,196"/>
    </g>
    <circle cx="1060" cy="172" r="7" fill="#C9803F"/>
    <circle cx="1080" cy="148" r="4" fill="#E6EDF3"/>
    <circle cx="1038" cy="194" r="4" fill="#E6EDF3"/>
    <circle cx="1082" cy="196" r="4" fill="#E6EDF3"/>
  </g>

  <!-- left fade so text stays clean -->
  <rect x="0" y="0" width="760" height="320" fill="url(#fade)"/>

  <!-- text -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <rect x="64" y="86" width="56" height="4" rx="2" fill="#C9803F"/>
    <text x="64" y="156" font-size="54" font-weight="700" fill="#F2F6F9" letter-spacing="0.5">Nwafor Arinze Jeremiah</text>
    <text x="64" y="204" font-size="24" font-weight="400" fill="#B8C7D4">Mechatronics Engineering student</text>
    <text x="64" y="238" font-size="24" font-weight="400" fill="#B8C7D4">IT support technician, learning cybersecurity</text>
